deploy:
  name: Push to EC2
  needs: build
  runs-on: ubuntu-latest

  steps:
    - name: Download Build Artifacts
      uses: actions/download-artifact@v4
      with:
        name: backend-dist
        path: dist

    - name: Download Package Files
      uses: actions/download-artifact@v4
      with:
        name: backend-package
        path: .

    - name: Checkout repository for prisma folder
      uses: actions/checkout@v4

    - name: Copy files to EC2
      uses: appleboy/scp-action@v0.1.7
      with:
        host: ${{ secrets.EC2_HOST }}
        username: ${{ secrets.EC2_USERNAME }}
        key: ${{ secrets.EC2_SSH_KEY }}

        source: "dist,prisma,package.json,pnpm-lock.yaml"
        target: "/home/${{ secrets.EC2_USERNAME }}/XConnect_backend"

    - name: Execute deployment commands on EC2
      uses: appleboy/ssh-action@v1.0.3
      with:
        host: ${{ secrets.EC2_HOST }}
        username: ${{ secrets.EC2_USERNAME }}
        key: ${{ secrets.EC2_SSH_KEY }}

        script: |
          export NVM_DIR="/home/${{ secrets.EC2_USERNAME }}/.nvm"

          if [ -s "$NVM_DIR/nvm.sh" ]; then
            . "$NVM_DIR/nvm.sh"
          fi

          export PATH="$PATH:/home/${{ secrets.EC2_USERNAME }}/.nvm/versions/node/v24.15.0/bin"

          echo "===== NODE ====="
          which node
          node -v

          echo "===== NPM ====="
          which npm
          npm -v

          echo "===== PNPM ====="
          which pnpm
          pnpm -v

          echo "===== PM2 ====="
          if ! command -v pm2 &> /dev/null; then
            npm install -g pm2
          fi

          cd /home/${{ secrets.EC2_USERNAME }}/XConnect_backend

          echo "===== INSTALL DEPENDENCIES ====="
          pnpm install --frozen-lockfile

          echo "===== GENERATE PRISMA ====="
          npx prisma generate

          echo "===== PM2 RESTART ====="
          pm2 reload xconnect-backend || pm2 start dist/src/main.js --name xconnect-backend

          pm2 save