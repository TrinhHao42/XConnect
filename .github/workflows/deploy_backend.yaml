name: Deploy Backend to EC2

on:
  push:
    branches:
      - main
    paths:
      - 'XConnect_backend/**'
      - '.github/workflows/deploy_backend.yaml'

jobs:

  test:
    name: Test Backend
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: ./XConnect_backend

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v3
        with:
          version: 9

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'pnpm'
          cache-dependency-path: './XConnect_backend/pnpm-lock.yaml'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run Linter
        run: pnpm run lint

      - name: Run Tests
        run: |
          if pnpm run | grep -q 'test'; then
            pnpm run test
          else
            echo "No test script found, skipping tests."
          fi

  build:
    name: Build Backend
    needs: test
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: ./XConnect_backend

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v3
        with:
          version: 9

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'pnpm'
          cache-dependency-path: './XConnect_backend/pnpm-lock.yaml'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build project
        run: pnpm run build

      - name: Upload dist artifact
        uses: actions/upload-artifact@v4
        with:
          name: backend-dist
          path: ./XConnect_backend/dist

      - name: Upload package files
        uses: actions/upload-artifact@v4
        with:
          name: backend-package
          path: |
            ./XConnect_backend/package.json
            ./XConnect_backend/pnpm-lock.yaml

  deploy:
    name: Deploy to EC2
    needs: build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download dist artifact
        uses: actions/download-artifact@v4
        with:
          name: backend-dist
          path: .

      - name: Download package files
        uses: actions/download-artifact@v4
        with:
          name: backend-package
          path: .

      - name: Debug files
        run: |
          echo "=== ROOT ==="
          ls -la

          echo "=== DIST ==="
          find dist -maxdepth 3

      - name: Copy dist
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USERNAME }}
          key: ${{ secrets.EC2_SSH_KEY }}
          source: "dist"
          target: "/home/${{ secrets.EC2_USERNAME }}/XConnect_backend"

      - name: Copy prisma and package files
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USERNAME }}
          key: ${{ secrets.EC2_SSH_KEY }}
          source: "XConnect_backend/prisma,package.json,pnpm-lock.yaml"
          target: "/home/${{ secrets.EC2_USERNAME }}/XConnect_backend"

      - name: Deploy on EC2
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USERNAME }}
          key: ${{ secrets.EC2_SSH_KEY }}

          script: |
            set -e

            export NVM_DIR="/home/${{ secrets.EC2_USERNAME }}/.nvm"
            export PATH="$NVM_DIR/versions/node/v24.15.0/bin:$PATH"

            node -v
            npm -v
            pnpm -v

            cd /home/${{ secrets.EC2_USERNAME }}/XConnect_backend

            echo "=== PROJECT FILES ==="
            find . -maxdepth 2

            pnpm install --prod --frozen-lockfile --ignore-scripts=false

            pnpm prisma generate

            if ! command -v pm2 &> /dev/null; then
              npm install -g pm2
            fi

            pm2 delete xconnect-backend || true

            pm2 start dist/main.js --name xconnect-backend

            pm2 save

            pm2 status