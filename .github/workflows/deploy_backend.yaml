name: Deploy Backend to EC2 with Docker

on:
  push:
    branches:
      - main
    paths:
      - 'XConnect_backend/**'
      - '.github/workflows/deploy_backend.yaml'

jobs:
  test:
    name: Test Backend
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./XConnect_backend
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: ./XConnect_backend/pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run Linter
        run: pnpm run lint

      - name: Run Tests
        run: |
          if pnpm run | grep -q "test"; then
            pnpm run test
          else
            echo "No test script found, skipping tests."
          fi

  build-and-push:
    name: Build and Push Docker Image
    needs: test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: ./XConnect_backend
          push: true
          tags: ${{ secrets.DOCKERHUB_USERNAME }}/xconnect-backend:latest

  deploy:
    name: Deploy to EC2
    needs: build-and-push
    runs-on: ubuntu-latest
    steps:
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USERNAME }}
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            set -e

            # Đảm bảo Docker được cài đặt (nếu chưa có)
            if ! command -v docker &> /dev/null; then
              echo "=== INSTALLING DOCKER ==="
              curl -fsSL https://get.docker.com -o get-docker.sh
              sudo sh get-docker.sh
              sudo systemctl enable docker
              sudo systemctl start docker
              sudo usermod -aG docker $USER
              
              # Tắt PM2 đang chạy bản cũ (chuyển giao công nghệ)
              if command -v pm2 &> /dev/null; then
                echo "=== STOPPING OLD PM2 INSTANCES ==="
                pm2 delete xconnect-backend || true
                pm2 save || true
              fi
            fi

            echo "=== PULLING NEW DOCKER IMAGE ==="
            sudo docker pull ${{ secrets.DOCKERHUB_USERNAME }}/xconnect-backend:latest

            echo "=== STOPPING OLD CONTAINER ==="
            sudo docker stop xconnect-backend || true
            sudo docker rm xconnect-backend || true

            echo "=== STARTING NEW CONTAINER ==="
            # Sử dụng file .env cũ đã có trên server từ đợt deploy PM2 trước
            sudo docker run -d --name xconnect-backend \
              --restart unless-stopped \
              -p 8080:8080 \
              --env-file /home/${{ secrets.EC2_USERNAME }}/XConnect_backend/.env \
              ${{ secrets.DOCKERHUB_USERNAME }}/xconnect-backend:latest

            echo "=== DEPLOYMENT COMPLETED ==="
            sudo docker ps | grep xconnect-backend