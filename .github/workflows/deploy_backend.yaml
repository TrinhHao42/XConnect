name: Deploy Backend to EC2 with Docker (Optimized)

on:
  push:
    branches:
      - main
    paths:
      - 'XConnect_backend/**'
      - '.github/workflows/deploy_backend.yaml'

jobs:
  test:
    name: Test Backend
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: ./XConnect_backend

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js (with npm cache)
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: XConnect_backend/package-lock.json

      - name: Install dependencies
        run: npm install

      - name: Run Linter
        run: npm run lint

      - name: Run Tests
        run: |
          if npm run | grep -q "test"; then
            npm run test
          else
            echo "No test script found, skipping tests."
          fi

  build-and-push:
    name: Build and Push Docker Image (Cached)
    needs: test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push Docker image (with cache)
        uses: docker/build-push-action@v5
        with:
          context: ./XConnect_backend
          push: true
          tags: ${{ secrets.DOCKERHUB_USERNAME }}/xconnect-backend:latest
          cache-from: type=registry,ref=${{ secrets.DOCKERHUB_USERNAME }}/xconnect-backend:buildcache
          cache-to: type=registry,ref=${{ secrets.DOCKERHUB_USERNAME }}/xconnect-backend:buildcache,mode=max
          build-args: |
            BUILDKIT_INLINE_CACHE=1

  deploy:
    name: Deploy to EC2
    needs: build-and-push
    runs-on: ubuntu-latest

    steps:
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USERNAME }}
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            set -e

            echo "=== PULL IMAGE ==="
            sudo docker pull ${{ secrets.DOCKERHUB_USERNAME }}/xconnect-backend:latest

            echo "=== STOP OLD CONTAINER ==="
            sudo docker stop xconnect-backend || true
            sudo docker rm xconnect-backend || true

            echo "=== START NEW CONTAINER ==="
            sudo docker run -d --name xconnect-backend \
              --restart unless-stopped \
              -p 8080:8080 \
              --env-file /home/${{ secrets.EC2_USERNAME }}/XConnect_backend/.env \
              ${{ secrets.DOCKERHUB_USERNAME }}/xconnect-backend:latest

            echo "=== DONE ==="
            sudo docker ps | grep xconnect-backend