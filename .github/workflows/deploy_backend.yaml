name: Deploy Backend to EC2

on:
  push:
    branches:
      - main
    paths:
      - 'XConnect_backend/**'
      - '.github/workflows/deploy_backend.yaml'

jobs:

  test:
    name: Test Backend
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: ./XConnect_backend

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: ./XConnect_backend/pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run Linter
        run: pnpm run lint

      - name: Run Tests
        run: |
          if pnpm run | grep -q "test"; then
            pnpm run test
          else
            echo "No test script found, skipping tests."
          fi

  build:
    name: Build Backend
    needs: test
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: ./XConnect_backend

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: ./XConnect_backend/pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Generate Prisma Client
        run: pnpm prisma generate

      - name: Build project
        run: pnpm run build

      - name: Debug dist
        run: |
          echo "=== DIST ==="
          find dist -maxdepth 5

      - name: Upload dist artifact
        uses: actions/upload-artifact@v4
        with:
          name: backend-dist
          path: XConnect_backend/dist

      - name: Upload backend files
        uses: actions/upload-artifact@v4
        with:
          name: backend-files
          path: |
            XConnect_backend/package.json
            XConnect_backend/pnpm-lock.yaml
            XConnect_backend/prisma

  deploy:
    name: Deploy to EC2
    needs: build
    runs-on: ubuntu-latest

    steps:
      - name: Download dist artifact
        uses: actions/download-artifact@v4
        with:
          name: backend-dist
          path: XConnect_backend/dist

      - name: Download backend files
        uses: actions/download-artifact@v4
        with:
          name: backend-files
          path: XConnect_backend

      - name: Debug downloaded files
        run: |
          echo "=== ROOT ==="
          ls -la

          echo "=== BACKEND FILES ==="
          find XConnect_backend -maxdepth 5

      - name: Copy backend files to EC2
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USERNAME }}
          key: ${{ secrets.EC2_SSH_KEY }}
          source: "XConnect_backend/*"
          target: "/home/${{ secrets.EC2_USERNAME }}/"

      - name: Deploy on EC2
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USERNAME }}
          key: ${{ secrets.EC2_SSH_KEY }}

          script: |
            set -e

            export NVM_DIR="/home/${{ secrets.EC2_USERNAME }}/.nvm"
            export PATH="$NVM_DIR/versions/node/v24.15.0/bin:$PATH"

            echo "=== NODE VERSION ==="
            node -v
            npm -v
            pnpm -v

            cd /home/${{ secrets.EC2_USERNAME }}/XConnect_backend

            echo "=== PROJECT FILES ==="
            find . -maxdepth 5

            echo "=== INSTALL PRODUCTION DEPS ==="
            pnpm install --prod --frozen-lockfile

            echo "=== GENERATE PRISMA CLIENT ==="
            pnpm prisma generate

            if ! command -v pm2 &> /dev/null; then
              echo "=== INSTALL PM2 ==="
              npm install -g pm2
            fi

            echo "=== RESTART APPLICATION ==="

            pm2 delete xconnect-backend || true

            pm2 start dist/src/main.js --name xconnect-backend

            pm2 save

            echo "=== PM2 STATUS ==="
            pm2 status

            echo "=== HEALTH CHECK ==="
            sleep 5

            pm2 logs xconnect-backend --lines 30